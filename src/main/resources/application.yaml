# ===============================
# Spring Datasource (PostgreSQL) & JPA
# ===============================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bookacita
    username: bookacita_user
    password: strongpassword123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update           # auto-create/update tables for development
    show-sql: true               # show SQL queries in logs
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: always               # ensure data.sql is executed for PostgreSQL

  jackson:
    serialization:
      indent_output: true

# ===============================
# Server Configuration
# ===============================
server:
  port: 8080
  servlet:
    context-path: /

# ===============================
# Logging
# ===============================
logging:
  level:
    org.springframework: INFO
    com.bookacita: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n"

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

# ===============================
# Email / Notification
# ===============================
notification:
  email:
    from: no-reply@bookacita.com
    smtp:
      host: smtp.example.com
      port: 587
      username: your_email_username
      password: your_email_password
      auth: true
      starttls-enable: true

# ===============================
# Application-specific properties
# ===============================
bookacita:
  appointment:
    max-bookings-per-day: 20
    reminder-days-before: 1
  business:
    max-availability-slots: 10
  customer:
    search-radius-km: 10
